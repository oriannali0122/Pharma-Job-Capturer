  - { group: Pharma, name: Merck & Co. (MSD),    type: workday, url: "https://msd.wd5.myworkdayjobs.com/SearchJobs",
      fallback: { type: phenom, url: "https://jobs.merck.com/us/en" } }
  - { group: Pharma, name: Novartis,             type: workday, url: "https://novartis.wd3.myworkdayjobs.com/Novartis_Careers" }
  - { group: Pharma, name: Roche / Genentech,    type: workday, url: "https://roche.wd3.myworkdayjobs.com/roche-ext" }
  - { group: Pharma, name: AstraZeneca,          type: workday, url: "https://astrazeneca.wd3.myworkdayjobs.com/Careers" }
  - { group: Pharma, name: Bristol Myers Squibb, type: workday, url: "https://bristolmyerssquibb.wd5.myworkdayjobs.com/BMS" }
  - { group: Pharma, name: GSK,                  type: workday, url: "https://gsk.wd5.myworkdayjobs.com/GSKCareers" }
  - { group: Pharma, name: Sanofi,               type: workday, url: "https://sanofi.wd3.myworkdayjobs.com/SanofiCareers" }
  - { group: Pharma, name: Eli Lilly,            type: workday, url: "https://lilly.wd5.myworkdayjobs.com/LLY",
      fallback: { type: phenom, url: "https://careers.lilly.com/us/en" } }
  - { group: Pharma, name: Takeda,               type: workday, url: "https://takeda.wd3.myworkdayjobs.com/External",
      fallback: { type: radancy, url: "https://jobs.takeda.com" } }
  - { group: Pharma, name: AbbVie,               type: smartrecruiters, url: "abbvie" }
  - { group: Pharma, name: Novo Nordisk,         type: successfactors, url: "https://careers.novonordisk.com" }
